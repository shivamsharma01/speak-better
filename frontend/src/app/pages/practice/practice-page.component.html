<div class="page">
  <header class="hero">
    <p class="eyebrow">Recorded practice</p>
    <h1>Speak Better</h1>
    <p class="sub">
      Record or upload. Get a bilingual transcript and clearer ways to say it.
    </p>
  </header>

  <section class="stage">
    <label class="field block">
      <span>Question you’re answering <em>(optional)</em></span>
      <textarea
        rows="3"
        placeholder="e.g. Why should we hire you?"
        [ngModel]="questionText()"
        (ngModelChange)="questionText.set($event)"
        [disabled]="processing()"
      ></textarea>
    </label>

    <div class="controls">
      <label class="field">
        <span>Speech hint</span>
        <select
          [ngModel]="language()"
          (ngModelChange)="language.set($event)"
          [disabled]="processing()"
        >
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
          <option value="hi">Hindi</option>
        </select>
      </label>
      <label class="field">
        <span>Coaching language</span>
        <select
          [ngModel]="responseLanguage()"
          (ngModelChange)="responseLanguage.set($event)"
          [disabled]="processing()"
        >
          <option value="en">English</option>
          <option value="same">Match spoken</option>
        </select>
      </label>
      <label class="field">
        <span>Tone</span>
        <select
          [ngModel]="tone()"
          (ngModelChange)="tone.set($event)"
          [disabled]="processing()"
        >
          <option value="">Varied</option>
          <option value="formal">Formal</option>
          <option value="casual">Casual</option>
          <option value="persuasive">Persuasive</option>
          <option value="concise">Concise</option>
        </select>
      </label>
    </div>

    <div class="capture">
      <app-recorder
        [locked]="processing()"
        (audioReady)="onAudioReady($event)"
        (recordError)="onRecordError($event)"
      />
      <div class="upload-wrap">
        <input
          #fileInput
          type="file"
          class="sr-only"
          accept="audio/*,video/mp4,.mp4,.webm,.m4a,.mp3,.wav,.mpeg,.mpga"
          [disabled]="processing()"
          (change)="onFileSelected($event)"
        />
        <button
          type="button"
          class="upload-btn"
          [disabled]="processing()"
          (click)="triggerFilePicker(fileInput)"
        >
          Upload audio or video
        </button>
      </div>
    </div>
  </section>

  <div class="status" *ngIf="processing()">
    <span class="spinner" aria-hidden="true"></span>
    <span>Transcribing and coaching…</span>
    <button type="button" class="cancel-btn" (click)="cancelProcessing()">Cancel</button>
  </div>

  <p class="alert" *ngIf="error() as err">{{ err }}</p>

  <main class="results" *ngIf="hasResults()">
    <div class="results-head">
      <h2>Your results</h2>
      <button type="button" class="ghost" (click)="clearResults()" [disabled]="processing()">
        Clear
      </button>
    </div>
    <app-transcript
      [textHindi]="transcriptHindi()"
      [textEnglish]="transcriptEnglish()"
      [text]="transcript()"
    />
    <app-suggestions [suggestions]="suggestions()" [speakLang]="ttsSpeakLang()" />
    <app-coaching-panel
      [modelAnswer]="modelAnswer()"
      [improvements]="improvements()"
      [speakLang]="ttsSpeakLang()"
    />
  </main>
</div>
