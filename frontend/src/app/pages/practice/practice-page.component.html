<div class="page">
  <header class="hero">
    <h1>{{ title }}</h1>
    <p class="sub">
      Record or <strong>upload</strong> audio/video. We transcribe in Hindi and English,
      then suggest clearer phrasing. Coaching defaults to <strong>English</strong>.
      Optionally add a <strong>question</strong> you are answering for example answers and coaching.
    </p>
  </header>

  <section class="panel">
    <label class="field block">
      <span>Question you are answering (optional)</span>
      <textarea
        rows="3"
        placeholder="e.g. Why should we hire you? / आपकी सबसे बड़ी ताकत क्या है?"
        [ngModel]="questionText()"
        (ngModelChange)="questionText.set($event)"
        [disabled]="processing()"
      ></textarea>
    </label>
  </section>

  <section class="controls">
    <label class="field">
      <span>Speech language hint</span>
      <select
        [ngModel]="language()"
        (ngModelChange)="language.set($event)"
        [disabled]="processing()"
      >
        <option value="auto">Auto-detect</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
      </select>
    </label>
    <label class="field">
      <span>Response language (coaching)</span>
      <select
        [ngModel]="responseLanguage()"
        (ngModelChange)="responseLanguage.set($event)"
        [disabled]="processing()"
      >
        <option value="en">English (default)</option>
        <option value="same">Match spoken language</option>
      </select>
    </label>
    <label class="field">
      <span>Tone for suggestions</span>
      <select
        [ngModel]="tone()"
        (ngModelChange)="tone.set($event)"
        [disabled]="processing()"
      >
        <option value="">Default (varied)</option>
        <option value="formal">Formal</option>
        <option value="casual">Casual</option>
        <option value="persuasive">Persuasive</option>
        <option value="concise">Concise</option>
      </select>
    </label>
    <button
      type="button"
      class="ghost"
      *ngIf="hasResults()"
      (click)="clearResults()"
      [disabled]="processing()"
    >
      Clear results
    </button>
  </section>

  <section class="capture">
    <app-recorder
      [locked]="processing()"
      (audioReady)="onAudioReady($event)"
      (recordError)="onRecordError($event)"
    />
    <div class="upload-wrap">
      <input
        #fileInput
        type="file"
        class="sr-only"
        accept="audio/*,video/mp4,.mp4,.webm,.m4a,.mp3,.wav,.mpeg,.mpga"
        [disabled]="processing()"
        (change)="onFileSelected($event)"
      />
      <button
        type="button"
        class="upload-btn"
        [disabled]="processing()"
        (click)="triggerFilePicker(fileInput)"
      >
        Upload audio or video
      </button>
    </div>
  </section>

  <div class="status" *ngIf="processing()">
    <span class="spinner" aria-hidden="true"></span>
    <span>Transcribing (Hindi + English) and analyzing…</span>
    <button type="button" class="cancel-btn" (click)="cancelProcessing()">Cancel</button>
  </div>

  <p class="alert" *ngIf="error() as err">{{ err }}</p>

  <main class="results" *ngIf="hasResults()">
    <app-transcript
      [textHindi]="transcriptHindi()"
      [textEnglish]="transcriptEnglish()"
      [text]="transcript()"
    />
    <app-suggestions [suggestions]="suggestions()" [speakLang]="ttsSpeakLang()" />
    <app-coaching-panel
      [modelAnswer]="modelAnswer()"
      [improvements]="improvements()"
      [speakLang]="ttsSpeakLang()"
    />
  </main>
</div>
